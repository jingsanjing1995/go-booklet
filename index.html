<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Go 小册</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="从基础到高级的 Go 自学小册：语法、并发、工程化与运行时原理。">
  <meta name="color-scheme" content="dark light">
  <script>
    (function () {
      var key = 'go-booklet-theme';
      var saved = localStorage.getItem(key);
      var theme = saved || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.css">
  <style>
    :root {
      --theme-color: #007d9c;
    }

    html {
      scrollbar-width: thin;
      scrollbar-color: #7a8a99 transparent;
    }

    html[data-theme="dark"] {
      scrollbar-color: #4a5a68 transparent;
    }

    body {
      overscroll-behavior-y: none;
    }

    .sidebar {
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }

    .sidebar-nav > ul > li > p {
      font-weight: 600;
    }

    .theme-toggle {
      position: fixed;
      right: 18px;
      bottom: 22px;
      z-index: 20;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 50%;
      background: var(--bg-elevated, #fff);
      color: var(--text, #34495e);
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      font-size: 18px;
      line-height: 1;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --theme-color: #3ec8e8;
      --bg: #0f1419;
      --bg-elevated: #161d25;
      --bg-sidebar: #12181f;
      --text: #d6dee6;
      --text-strong: #f2f5f8;
      --muted: #8b98a5;
      --border: #2a3540;
      --code-bg: #1c242d;
      --quote-bg: #182028;
    }

    html[data-theme="dark"] body {
      background: var(--bg);
      color: var(--text);
    }

    html[data-theme="dark"] .sidebar {
      background: var(--bg-sidebar);
      border-right-color: var(--border);
      color: var(--text);
    }

    html[data-theme="dark"] .sidebar ul li a,
    html[data-theme="dark"] .app-name-link {
      color: var(--text);
    }

    html[data-theme="dark"] .sidebar ul li.active > a {
      color: var(--theme-color);
    }

    html[data-theme="dark"] .sidebar-toggle {
      background: transparent;
    }

    html[data-theme="dark"] .sidebar-toggle span {
      background: var(--muted);
    }

    html[data-theme="dark"] .content {
      background: var(--bg);
    }

    html[data-theme="dark"] .markdown-section,
    html[data-theme="dark"] .markdown-section p,
    html[data-theme="dark"] .markdown-section li,
    html[data-theme="dark"] .markdown-section td,
    html[data-theme="dark"] .markdown-section th {
      color: var(--text);
    }

    html[data-theme="dark"] .markdown-section h1,
    html[data-theme="dark"] .markdown-section h2,
    html[data-theme="dark"] .markdown-section h3,
    html[data-theme="dark"] .markdown-section h4,
    html[data-theme="dark"] .markdown-section strong {
      color: var(--text-strong);
    }

    html[data-theme="dark"] .markdown-section a {
      color: var(--theme-color);
    }

    html[data-theme="dark"] .markdown-section hr {
      border-bottom-color: var(--border);
    }

    html[data-theme="dark"] .markdown-section blockquote {
      background: var(--quote-bg);
      border-left-color: var(--theme-color);
      color: var(--muted);
    }

    html[data-theme="dark"] .markdown-section table {
      display: block;
      overflow-x: auto;
    }

    html[data-theme="dark"] .markdown-section tr {
      border-color: var(--border);
    }

    html[data-theme="dark"] .markdown-section tr:nth-child(2n) {
      background-color: var(--bg-elevated);
    }

    html[data-theme="dark"] .markdown-section code,
    html[data-theme="dark"] .markdown-section pre {
      background: var(--code-bg);
      color: #e6edf3;
    }

    html[data-theme="dark"] .markdown-section pre {
      border: 1px solid var(--border);
    }

    html[data-theme="dark"] .markdown-section code {
      color: #f0b429;
    }

    html[data-theme="dark"] .markdown-section pre > code {
      color: #e6edf3;
      background: transparent;
    }

    html[data-theme="dark"] .search {
      border-bottom-color: var(--border);
    }

    html[data-theme="dark"] .search input {
      background: var(--bg-elevated);
      color: var(--text);
    }

    html[data-theme="dark"] .search .results-panel {
      background: var(--bg-elevated);
      color: var(--text);
    }

    html[data-theme="dark"] .anchor span {
      color: var(--text-strong);
    }

    html[data-theme="dark"] .github-corner svg {
      color: var(--bg);
    }

    .go-tour-wrap {
      margin: 1.4rem 0 2rem;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-elevated, #fff);
    }

    .go-tour-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border, #e5e5e5);
      font-size: 14px;
    }

    .go-tour-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .go-tour-actions button,
    .go-tour-actions a {
      border: 1px solid var(--border, #d9d9d9);
      background: var(--bg, #fff);
      color: var(--text, #34495e);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      line-height: 1.4;
    }

    .go-tour-actions .primary {
      background: var(--theme-color, #007d9c);
      border-color: transparent;
      color: #fff;
    }

    .go-tour-note {
      margin: 0;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--muted, #666);
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .go-tour-editor {
      width: 100%;
      min-height: 280px;
      box-sizing: border-box;
      border: 0;
      padding: 14px 16px;
      resize: vertical;
      font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #11171d;
      color: #e6edf3;
    }

    .go-tour-output {
      margin: 0;
      min-height: 88px;
      max-height: 240px;
      overflow: auto;
      padding: 12px 16px;
      border-top: 1px solid var(--border, #e5e5e5);
      background: #0c1014;
      color: #b4e2a8;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="app">加载中…</div>
  <button class="theme-toggle" type="button" aria-label="切换暗黑模式" title="切换主题">☾</button>
  <script>
    window.$docsify = {
      name: 'Go 小册',
      repo: 'jingsanjing1995/go-booklet',
      homepage: 'go小册/README.md',
      loadSidebar: true,
      auto2top: false,
      maxLevel: 3,
      subMaxLevel: 2,
      search: {
        placeholder: '搜索',
        noData: '没有结果',
        depth: 3
      },
      plugins: [
        function (hook) {
          var lastPage = ''
          hook.ready(function () {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
            if (typeof Lenis === 'undefined') return
            window.__lenis = new Lenis({
              autoRaf: true,
              anchors: true,
              duration: 1.15,
              easing: function (t) {
                return 1 - Math.pow(1 - t, 3)
              },
              smoothWheel: true,
              wheelMultiplier: 0.86,
              touchMultiplier: 1.1,
              infinite: false,
              prevent: function (node) {
                return node.closest && node.closest('textarea, .go-tour-wrap')
              }
            })
          })
          hook.doneEach(function () {
            var page = (location.hash.split('?')[0] || '')
            var lenis = window.__lenis
            if (lenis) lenis.resize()
            if (page === lastPage) return
            lastPage = page
            if (lenis) {
              lenis.scrollTo(0, { duration: 0.7 })
            } else {
              window.scrollTo({ top: 0, behavior: 'smooth' })
            }
          })
        },
        function (hook) {
          var hello = 'package main\n\nimport "fmt"\n\nfunc main() {\n\tfmt.Println("Hello, 小册")\n}\n'
          var lessons = {
            '01-认识Go': ['welcome/1', 'Welcome', hello],
            '02-环境与工具链': ['welcome/1', 'Welcome', hello],
            '03-程序结构与第一个程序': ['basics/1', 'Packages', 'package main\n\nimport (\n\t"fmt"\n\t"math/rand"\n)\n\nfunc main() {\n\tfmt.Println("My favorite number is", rand.Intn(10))\n}\n'],
            '04-变量常量与基础类型': ['basics/8', 'Variables', 'package main\n\nimport "fmt"\n\nfunc main() {\n\tvar i int = 42\n\tvar f = float64(i)\n\tconst Pi = 3.14\n\tfmt.Println(i, f, Pi)\n}\n'],
            '05-运算符与控制流': ['flowcontrol/1', 'For', 'package main\n\nimport "fmt"\n\nfunc main() {\n\tsum := 0\n\tfor i := 0; i < 10; i++ {\n\t\tsum += i\n\t}\n\tfmt.Println(sum)\n}\n'],
            '06-函数': ['basics/4', 'Functions', 'package main\n\nimport "fmt"\n\nfunc add(x, y int) int {\n\treturn x + y\n}\n\nfunc main() {\n\tfmt.Println(add(42, 13))\n}\n'],
            '07-数组切片与Map': ['moretypes/7', 'Slices', 'package main\n\nimport "fmt"\n\nfunc main() {\n\tprimes := [6]int{2, 3, 5, 7, 11, 13}\n\tvar s []int = primes[1:4]\n\tfmt.Println(s, len(s), cap(s))\n}\n'],
            '08-字符串字节与rune': ['moretypes/16', 'Range', 'package main\n\nimport "fmt"\n\nfunc main() {\n\ts := "Go小册"\n\tfor i, r := range s {\n\t\tfmt.Printf("%d %c\\n", i, r)\n\t}\n}\n'],
            '01-指针': ['moretypes/1', 'Pointers', 'package main\n\nimport "fmt"\n\nfunc main() {\n\ti, j := 42, 2701\n\tp := &i\n\tfmt.Println(*p)\n\t*p = 21\n\tfmt.Println(i, j)\n}\n'],
            '02-结构体与方法': ['moretypes/2', 'Structs', 'package main\n\nimport "fmt"\n\ntype Vertex struct {\n\tX int\n\tY int\n}\n\nfunc (v Vertex) Abs() int {\n\tif v.X < 0 {\n\t\treturn -v.X\n\t}\n\treturn v.X\n}\n\nfunc main() {\n\tv := Vertex{1, 2}\n\tfmt.Println(v, v.Abs())\n}\n'],
            '03-接口': ['methods/9', 'Interfaces', 'package main\n\nimport (\n\t"fmt"\n\t"math"\n)\n\ntype Abser interface {\n\tAbs() float64\n}\n\ntype Vertex struct{ X, Y float64 }\n\nfunc (v Vertex) Abs() float64 {\n\treturn math.Sqrt(v.X*v.X + v.Y*v.Y)\n}\n\nfunc main() {\n\tvar a Abser = Vertex{3, 4}\n\tfmt.Println(a.Abs())\n}\n'],
            '04-错误处理': ['methods/19', 'Errors', 'package main\n\nimport (\n\t"fmt"\n\t"time"\n)\n\ntype MyError struct {\n\tWhen time.Time\n\tWhat string\n}\n\nfunc (e *MyError) Error() string {\n\treturn fmt.Sprintf("%v: %s", e.When, e.What)\n}\n\nfunc run() error {\n\treturn &MyError{time.Now(), "it didn\'t work"}\n}\n\nfunc main() {\n\tif err := run(); err != nil {\n\t\tfmt.Println(err)\n\t}\n}\n'],
            '05-包模块与依赖': ['basics/1', 'Packages', 'package main\n\nimport (\n\t"fmt"\n\t"math/rand"\n)\n\nfunc main() {\n\tfmt.Println("My favorite number is", rand.Intn(10))\n}\n'],
            '06-defer-panic-recover': ['flowcontrol/12', 'Defer', 'package main\n\nimport "fmt"\n\nfunc main() {\n\tdefer fmt.Println("world")\n\tfmt.Println("hello")\n}\n'],
            '07-标准库精选': ['welcome/1', 'Welcome', hello],
            '01-Goroutine': ['concurrency/1', 'Goroutines', 'package main\n\nimport (\n\t"fmt"\n\t"time"\n)\n\nfunc say(s string) {\n\tfor i := 0; i < 3; i++ {\n\t\ttime.Sleep(80 * time.Millisecond)\n\t\tfmt.Println(s)\n\t}\n}\n\nfunc main() {\n\tgo say("world")\n\tsay("hello")\n}\n'],
            '02-Channel': ['concurrency/2', 'Channels', 'package main\n\nimport "fmt"\n\nfunc sum(s []int, c chan int) {\n\tsum := 0\n\tfor _, v := range s {\n\t\tsum += v\n\t}\n\tc <- sum\n}\n\nfunc main() {\n\ts := []int{7, 2, 8, -9, 4, 0}\n\tc := make(chan int)\n\tgo sum(s[:len(s)/2], c)\n\tgo sum(s[len(s)/2:], c)\n\tx, y := <-c, <-c\n\tfmt.Println(x, y, x+y)\n}\n'],
            '03-Select与超时': ['concurrency/5', 'Select', 'package main\n\nimport (\n\t"fmt"\n\t"time"\n)\n\nfunc main() {\n\tc1 := make(chan string, 1)\n\tgo func() {\n\t\ttime.Sleep(80 * time.Millisecond)\n\t\tc1 <- "result"\n\t}()\n\tselect {\n\tcase msg := <-c1:\n\t\tfmt.Println(msg)\n\tcase <-time.After(200 * time.Millisecond):\n\t\tfmt.Println("timeout")\n\t}\n}\n'],
            '04-sync包': ['concurrency/9', 'sync.Mutex', 'package main\n\nimport (\n\t"fmt"\n\t"sync"\n)\n\ntype SafeCounter struct {\n\tmu sync.Mutex\n\tv  map[string]int\n}\n\nfunc (c *SafeCounter) Inc(key string) {\n\tc.mu.Lock()\n\tc.v[key]++\n\tc.mu.Unlock()\n}\n\nfunc main() {\n\tc := SafeCounter{v: make(map[string]int)}\n\tvar wg sync.WaitGroup\n\tfor i := 0; i < 8; i++ {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tc.Inc("k")\n\t\t}()\n\t}\n\twg.Wait()\n\tfmt.Println(c.v["k"])\n}\n'],
            '05-Context': ['concurrency/1', 'Goroutines', 'package main\n\nimport (\n\t"context"\n\t"fmt"\n\t"time"\n)\n\nfunc main() {\n\tctx, cancel := context.WithTimeout(context.Background(), 50*time.Millisecond)\n\tdefer cancel()\n\tselect {\n\tcase <-time.After(200 * time.Millisecond):\n\t\tfmt.Println("done")\n\tcase <-ctx.Done():\n\t\tfmt.Println(ctx.Err())\n\t}\n}\n'],
            '06-并发模式与陷阱': ['concurrency/2', 'Channels', 'package main\n\nimport "fmt"\n\nfunc main() {\n\tch := make(chan int, 2)\n\tch <- 1\n\tch <- 2\n\tfmt.Println(<-ch)\n\tfmt.Println(<-ch)\n}\n'],
            '01-泛型': ['generics/1', 'Type parameters', 'package main\n\nimport "fmt"\n\nfunc Index[T comparable](s []T, x T) int {\n\tfor i, v := range s {\n\t\tif v == x {\n\t\t\treturn i\n\t\t}\n\t}\n\treturn -1\n}\n\nfunc main() {\n\tfmt.Println(Index([]int{1, 2, 3}, 2))\n\tfmt.Println(Index([]string{"a", "b"}, "z"))\n}\n'],
            '02-反射与unsafe': ['methods/15', 'Type assertions', 'package main\n\nimport "fmt"\n\nfunc main() {\n\tvar i interface{} = "hello"\n\ts, ok := i.(string)\n\tfmt.Println(s, ok)\n\tn, ok := i.(int)\n\tfmt.Println(n, ok)\n}\n'],
            '04-IO文件与编码': ['methods/21', 'Readers', 'package main\n\nimport (\n\t"fmt"\n\t"io"\n\t"strings"\n)\n\nfunc main() {\n\tr := strings.NewReader("Hello, Reader!")\n\tb := make([]byte, 8)\n\tfor {\n\t\tn, err := r.Read(b)\n\t\tfmt.Printf("n=%d err=%v %q\\n", n, err, b[:n])\n\t\tif err == io.EOF {\n\t\t\tbreak\n\t\t}\n\t}\n}\n'],
            '01-GMP调度器': ['concurrency/1', 'Goroutines', hello]
          }

          function lessonFor(hash) {
            var path = decodeURIComponent(hash || '')
            var keys = Object.keys(lessons)
            for (var i = 0; i < keys.length; i++) {
              if (path.indexOf(keys[i]) !== -1) return lessons[keys[i]]
            }
            return ['welcome/1', 'A Tour of Go', hello]
          }

          function insertTour() {
            var headings = document.querySelectorAll('.markdown-section h2')
            var h2 = null
            for (var i = 0; i < headings.length; i++) {
              if (headings[i].textContent.replace(/\s/g, '') === '练习') {
                h2 = headings[i]
                break
              }
            }
            if (!h2 || h2.parentNode.querySelector('.go-tour-wrap')) return

            var last = h2
            var node = h2.nextElementSibling
            while (node && node.tagName !== 'H2') {
              var text = (node.textContent || '').trim()
              if (text.indexOf('下一章') === 0 || text.indexOf('对应示例') === 0 || text.indexOf('入门篇结束') === 0) break
              last = node
              node = node.nextElementSibling
            }

            var info = lessonFor(location.hash)
            var tourURL = 'https://go.dev/tour/' + info[0]
            var wrap = document.createElement('div')
            wrap.className = 'go-tour-wrap'
            wrap.innerHTML =
              '<div class="go-tour-bar">' +
                '<strong>练习台 · ' + info[1] + '</strong>' +
                '<div class="go-tour-actions">' +
                  '<button type="button" class="primary" data-act="run">运行</button>' +
                  '<button type="button" data-act="reset">重置</button>' +
                  '<a href="' + tourURL + '" target="_blank" rel="noopener">打开 Tour</a>' +
                  '<button type="button" data-act="play">打开 Playground</button>' +
                '</div>' +
              '</div>' +
              '<p class="go-tour-note">go.dev 禁止被嵌入，所以练习在本页运行（走官方 Playground 编译接口）。完整图文课请点「打开 Tour」。</p>' +
              '<textarea class="go-tour-editor" spellcheck="false"></textarea>' +
              '<pre class="go-tour-output">点击「运行」查看输出</pre>'

            var editor = wrap.querySelector('textarea')
            var output = wrap.querySelector('.go-tour-output')
            editor.value = info[2]
            last.after(wrap)

            function compile() {
              output.textContent = '运行中…'
              var body = new URLSearchParams()
              body.set('version', '2')
              body.set('withVet', 'true')
              body.set('body', editor.value)
              return fetch('https://play.golang.org/compile?backend=', {
                method: 'POST',
                body: body
              }).then(function (res) { return res.json() })
            }

            wrap.querySelector('[data-act="run"]').addEventListener('click', function () {
              compile().then(function (data) {
                if (data.Errors) {
                  output.textContent = data.Errors
                  return
                }
                var events = data.Events || []
                output.textContent = events.length
                  ? events.map(function (e) { return e.Message }).join('')
                  : '(没有输出)'
              }).catch(function (err) {
                output.textContent = '运行失败：' + err.message + '\n请改用「打开 Tour」或「打开 Playground」。'
              })
            })

            wrap.querySelector('[data-act="reset"]').addEventListener('click', function () {
              editor.value = info[2]
              output.textContent = '已重置，点击「运行」查看输出'
            })

            wrap.querySelector('[data-act="play"]').addEventListener('click', function () {
              output.textContent = '正在打开 Playground…'
              fetch('https://play.golang.org/share', {
                method: 'POST',
                body: editor.value
              }).then(function (res) { return res.text() }).then(function (key) {
                window.open('https://go.dev/play/p/' + key.trim(), '_blank', 'noopener')
                output.textContent = '已在新标签打开 Playground'
              }).catch(function () {
                window.open(tourURL, '_blank', 'noopener')
                output.textContent = '分享失败，已改为打开 Tour'
              })
            })

            if (window.__lenis) window.__lenis.resize()
          }

          hook.doneEach(insertTour)
        }
      ]
    }

    ;(function () {
      var key = 'go-booklet-theme'
      var btn = document.querySelector('.theme-toggle')

      function current() {
        return document.documentElement.getAttribute('data-theme') || 'dark'
      }

      function apply(theme) {
        document.documentElement.setAttribute('data-theme', theme)
        localStorage.setItem(key, theme)
        btn.textContent = theme === 'dark' ? '☀' : '☾'
        btn.title = theme === 'dark' ? '切换到浅色模式' : '切换到暗黑模式'
      }

      apply(current())
      btn.addEventListener('click', function () {
        apply(current() === 'dark' ? 'light' : 'dark')
      })
    })()
  </script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
