<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Go 小册</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="从基础到高级的 Go 自学小册：语法、并发、工程化与运行时原理。">
  <meta name="color-scheme" content="dark light">
  <script>
    (function () {
      var key = 'go-booklet-theme';
      var saved = localStorage.getItem(key);
      var theme = saved || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.css">
  <style>
    :root {
      --theme-color: #007d9c;
    }

    html {
      scrollbar-width: thin;
      scrollbar-color: #7a8a99 transparent;
    }

    html[data-theme="dark"] {
      scrollbar-color: #4a5a68 transparent;
    }

    body {
      overscroll-behavior-y: none;
    }

    .sidebar {
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }

    .sidebar-nav > ul > li > p {
      font-weight: 600;
    }

    .theme-toggle {
      position: fixed;
      right: 18px;
      bottom: 22px;
      z-index: 20;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 50%;
      background: var(--bg-elevated, #fff);
      color: var(--text, #34495e);
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      font-size: 18px;
      line-height: 1;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --theme-color: #3ec8e8;
      --bg: #0f1419;
      --bg-elevated: #161d25;
      --bg-sidebar: #12181f;
      --text: #d6dee6;
      --text-strong: #f2f5f8;
      --muted: #8b98a5;
      --border: #2a3540;
      --code-bg: #1c242d;
      --quote-bg: #182028;
    }

    html[data-theme="dark"] body {
      background: var(--bg);
      color: var(--text);
    }

    html[data-theme="dark"] .sidebar {
      background: var(--bg-sidebar);
      border-right-color: var(--border);
      color: var(--text);
    }

    html[data-theme="dark"] .sidebar ul li a,
    html[data-theme="dark"] .app-name-link {
      color: var(--text);
    }

    html[data-theme="dark"] .sidebar ul li.active > a {
      color: var(--theme-color);
    }

    html[data-theme="dark"] .sidebar-toggle {
      background: transparent;
    }

    html[data-theme="dark"] .sidebar-toggle span {
      background: var(--muted);
    }

    html[data-theme="dark"] .content {
      background: var(--bg);
    }

    html[data-theme="dark"] .markdown-section,
    html[data-theme="dark"] .markdown-section p,
    html[data-theme="dark"] .markdown-section li,
    html[data-theme="dark"] .markdown-section td,
    html[data-theme="dark"] .markdown-section th {
      color: var(--text);
    }

    html[data-theme="dark"] .markdown-section h1,
    html[data-theme="dark"] .markdown-section h2,
    html[data-theme="dark"] .markdown-section h3,
    html[data-theme="dark"] .markdown-section h4,
    html[data-theme="dark"] .markdown-section strong {
      color: var(--text-strong);
    }

    html[data-theme="dark"] .markdown-section a {
      color: var(--theme-color);
    }

    html[data-theme="dark"] .markdown-section hr {
      border-bottom-color: var(--border);
    }

    html[data-theme="dark"] .markdown-section blockquote {
      background: var(--quote-bg);
      border-left-color: var(--theme-color);
      color: var(--muted);
    }

    html[data-theme="dark"] .markdown-section table {
      display: block;
      overflow-x: auto;
    }

    html[data-theme="dark"] .markdown-section tr {
      border-color: var(--border);
    }

    html[data-theme="dark"] .markdown-section tr:nth-child(2n) {
      background-color: var(--bg-elevated);
    }

    html[data-theme="dark"] .markdown-section code,
    html[data-theme="dark"] .markdown-section pre {
      background: var(--code-bg);
      color: #e6edf3;
    }

    html[data-theme="dark"] .markdown-section pre {
      border: 1px solid var(--border);
    }

    html[data-theme="dark"] .markdown-section code {
      color: #f0b429;
    }

    html[data-theme="dark"] .markdown-section pre > code {
      color: #e6edf3;
      background: transparent;
    }

    html[data-theme="dark"] .search {
      border-bottom-color: var(--border);
    }

    html[data-theme="dark"] .search input {
      background: var(--bg-elevated);
      color: var(--text);
    }

    html[data-theme="dark"] .search .results-panel {
      background: var(--bg-elevated);
      color: var(--text);
    }

    html[data-theme="dark"] .anchor span {
      color: var(--text-strong);
    }

    html[data-theme="dark"] .github-corner svg {
      color: var(--bg);
    }

    .go-tour-wrap {
      margin: 1.4rem 0 2rem;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-elevated, #fff);
    }

    .go-tour-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border, #e5e5e5);
      font-size: 14px;
    }

    .go-tour-bar a {
      color: var(--theme-color, #007d9c);
      font-weight: 600;
      white-space: nowrap;
    }

    .go-tour-wrap iframe,
    .go-tour-fallback {
      width: 100%;
      height: min(72vh, 760px);
      border: 0;
      background: #fff;
    }

    .go-tour-fallback {
      display: none;
      box-sizing: border-box;
      padding: 28px 22px;
      background: var(--bg, #fafafa);
      color: var(--text, #34495e);
    }

    .go-tour-wrap.is-blocked iframe {
      display: none;
    }

    .go-tour-wrap.is-blocked .go-tour-fallback {
      display: block;
    }
  </style>
</head>
<body>
  <div id="app">加载中…</div>
  <button class="theme-toggle" type="button" aria-label="切换暗黑模式" title="切换主题">☾</button>
  <script>
    window.$docsify = {
      name: 'Go 小册',
      repo: 'jingsanjing1995/go-booklet',
      homepage: 'go小册/README.md',
      loadSidebar: true,
      auto2top: false,
      maxLevel: 3,
      subMaxLevel: 2,
      search: {
        placeholder: '搜索',
        noData: '没有结果',
        depth: 3
      },
      plugins: [
        function (hook) {
          var lastPage = ''
          hook.ready(function () {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
            if (typeof Lenis === 'undefined') return
            window.__lenis = new Lenis({
              autoRaf: true,
              anchors: true,
              duration: 1.15,
              easing: function (t) {
                return 1 - Math.pow(1 - t, 3)
              },
              smoothWheel: true,
              wheelMultiplier: 0.86,
              touchMultiplier: 1.1,
              infinite: false
            })
          })
          hook.doneEach(function () {
            var page = (location.hash.split('?')[0] || '')
            var lenis = window.__lenis
            if (lenis) lenis.resize()
            if (page === lastPage) return
            lastPage = page
            if (lenis) {
              lenis.scrollTo(0, { duration: 0.7 })
            } else {
              window.scrollTo({ top: 0, behavior: 'smooth' })
            }
          })
        },
        function (hook) {
          var lessons = {
            '01-认识Go': ['welcome/1', 'Welcome'],
            '02-环境与工具链': ['welcome/1', 'Welcome'],
            '03-程序结构与第一个程序': ['basics/1', 'Packages'],
            '04-变量常量与基础类型': ['basics/8', 'Variables'],
            '05-运算符与控制流': ['flowcontrol/1', 'For'],
            '06-函数': ['basics/4', 'Functions'],
            '07-数组切片与Map': ['moretypes/6', 'Arrays & Slices'],
            '08-字符串字节与rune': ['moretypes/7', 'Slices'],
            '01-指针': ['moretypes/1', 'Pointers'],
            '02-结构体与方法': ['moretypes/2', 'Structs'],
            '03-接口': ['methods/9', 'Interfaces'],
            '04-错误处理': ['methods/19', 'Errors'],
            '05-包模块与依赖': ['basics/1', 'Packages'],
            '06-defer-panic-recover': ['flowcontrol/12', 'Defer'],
            '07-标准库精选': ['welcome/1', 'Welcome'],
            '01-Goroutine': ['concurrency/1', 'Goroutines'],
            '02-Channel': ['concurrency/2', 'Channels'],
            '03-Select与超时': ['concurrency/5', 'Select'],
            '04-sync包': ['concurrency/9', 'sync.Mutex'],
            '05-Context': ['concurrency/1', 'Goroutines'],
            '06-并发模式与陷阱': ['concurrency/7', 'Exercise: Equivalent Binary Trees'],
            '01-泛型': ['generics/1', 'Type parameters'],
            '02-反射与unsafe': ['methods/15', 'Type assertions'],
            '04-IO文件与编码': ['methods/21', 'Readers'],
            '01-GMP调度器': ['concurrency/1', 'Goroutines']
          }

          function lessonFor(hash) {
            var path = decodeURIComponent(hash || '')
            var keys = Object.keys(lessons)
            for (var i = 0; i < keys.length; i++) {
              if (path.indexOf(keys[i]) !== -1) return lessons[keys[i]]
            }
            return ['welcome/1', 'A Tour of Go']
          }

          function insertTour() {
            var headings = document.querySelectorAll('.markdown-section h2')
            var h2 = null
            for (var i = 0; i < headings.length; i++) {
              if (headings[i].textContent.replace(/\s/g, '') === '练习') {
                h2 = headings[i]
                break
              }
            }
            if (!h2 || h2.parentNode.querySelector('.go-tour-wrap')) return

            var last = h2
            var node = h2.nextElementSibling
            while (node && node.tagName !== 'H2') {
              var text = (node.textContent || '').trim()
              if (text.indexOf('下一章') === 0 || text.indexOf('对应示例') === 0 || text.indexOf('入门篇结束') === 0) break
              last = node
              node = node.nextElementSibling
            }

            var info = lessonFor(location.hash)
            var url = 'https://go.dev/tour/' + info[0]
            var wrap = document.createElement('div')
            wrap.className = 'go-tour-wrap'
            wrap.innerHTML =
              '<div class="go-tour-bar">' +
                '<span>Go Tour · ' + info[1] + '</span>' +
                '<a href="' + url + '" target="_blank" rel="noopener">新标签打开</a>' +
              '</div>' +
              '<iframe title="A Tour of Go" src="' + url + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>' +
              '<div class="go-tour-fallback">' +
                '<p>go.dev 禁止第三方站点内嵌 Tour。请用右上角「新标签打开」，在官方练习里跑代码，再回来做本章题目。</p>' +
                '<p><a href="' + url + '" target="_blank" rel="noopener">' + url + '</a></p>' +
              '</div>'
            last.after(wrap)

            var iframe = wrap.querySelector('iframe')
            window.setTimeout(function () {
              var blocked = false
              try {
                var href = iframe.contentWindow && iframe.contentWindow.location.href
                blocked = !href || href === 'about:blank'
              } catch (e) {
                blocked = false
              }
              if (blocked) wrap.classList.add('is-blocked')
              if (window.__lenis) window.__lenis.resize()
            }, 900)
          }

          hook.doneEach(insertTour)
        }
      ]
    }

    ;(function () {
      var key = 'go-booklet-theme'
      var btn = document.querySelector('.theme-toggle')

      function current() {
        return document.documentElement.getAttribute('data-theme') || 'dark'
      }

      function apply(theme) {
        document.documentElement.setAttribute('data-theme', theme)
        localStorage.setItem(key, theme)
        btn.textContent = theme === 'dark' ? '☀' : '☾'
        btn.title = theme === 'dark' ? '切换到浅色模式' : '切换到暗黑模式'
      }

      apply(current())
      btn.addEventListener('click', function () {
        apply(current() === 'dark' ? 'light' : 'dark')
      })
    })()
  </script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
